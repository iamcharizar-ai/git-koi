name: Ripples check
on:
  push:
    branches: [ripples]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal -c rustfmt,clippy
      - name: Format diff
        run: cargo +stable fmt --all -- --check || true
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +stable test --locked
      - name: Document
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
